name: Ediciones

# Los tres sistemas preparan la misma versión. Cada edición ejecuta sus pruebas
# nativas antes de empaquetar; no se publica una release desde este workflow.
# Linux ofrece un tar para la instalación local; no se instala RPM en QA local.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  edicion:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Linux
            os: ubuntu-22.04
          - nombre: Windows (sin probar)
            os: windows-latest
          - nombre: macOS (sin probar)
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify
      - name: Runtime nativo
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      # `createUpdaterArtifacts` firma cada paquete para el actualizador; sin la
      # clave privada la compilación fallaría, por eso solo se activa aquí.
      - name: Empaquetar
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/empaquetar-linux-nativo.sh
          else
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          fi
      - name: Avisar de que no está verificada
        if: runner.os != 'Linux'
        shell: bash
        run: echo "::warning::${{ matrix.nombre }} se construyó, pero nadie la ha ejecutado en un equipo real."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/tar/*.tar.gz
            src-tauri/target/release/bundle/tar/*.tar.gz.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  conservar-ultima:
    name: Conservar la última ejecución
    if: always() && github.event_name != 'pull_request'
    needs: [edicion]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/limpiar-ejecuciones.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NB_WORKFLOW_ARCHIVO: ediciones.yml
